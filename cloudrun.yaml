# Google Cloud Run 服务配置模板（零成本单实例 + GCS SQLite 状态持久化方案）
# 部署前请将 <GCP_PROJECT_ID>、<SERVICE_ACCOUNT> 与 <GCS_STATE_BUCKET> 替换为你的真实值。
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bazi-lottery
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # 锁定单实例以确保本地 SQLite + GCS 快照同步架构下零脑裂与零并发写冲突
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: <SERVICE_ACCOUNT>@<GCP_PROJECT_ID>.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: asia-east1-docker.pkg.dev/<GCP_PROJECT_ID>/cloud-run-source-deploy/bazi-lottery:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ENV
              value: "production"
            - name: TZ
              value: "Asia/Shanghai"
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash"
            - name: AUTO_SYNC_ON_STARTUP
              value: "false"
            - name: GCS_STATE_BUCKET
              value: "<GCS_STATE_BUCKET>"
            - name: GCS_STATE_OBJECT
              value: "bazi-lottery/lottery.db"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bazi-gemini-api-key
                  key: latest
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bazi-admin-token
                  key: latest
            - name: APP_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: bazi-app-hmac-secret
                  key: latest
