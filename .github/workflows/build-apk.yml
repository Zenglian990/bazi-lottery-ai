name: Build and Release Signed Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate:
    name: Backend & E2E Pre-Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx scipy
          python -m pytest backend/tests -q
          python tests_e2e/run_all_e2e.py

  build-apk:
    name: Test, Sign & Publish Release APK
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract dynamic versionName from build.gradle.kts
        id: version
        run: |
          VER=$(grep -E 'versionName\s*=' android/app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Detected Android version: v${VER}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Release Keystore (if configured in Secrets)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded successfully."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; falling back to debug signing."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android JVM Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Signed & R8-Minified Release APK
        env:
          APP_HMAC_SECRET: ${{ secrets.APP_HMAC_SECRET }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/ZengLian-Lottery-v${{ steps.version.outputs.name }}.apk"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZengLian-Lottery-${{ steps.version.outputs.tag }}
          path: android/app/build/outputs/apk/release/ZengLian-Lottery-v${{ steps.version.outputs.name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "曾练彩票助手 ${{ steps.version.outputs.tag }} (Release)"
          body: |
            ## 曾练彩票助手 ${{ steps.version.outputs.tag }} 面向大众正式版

            ### 核心特性与本次升级：
            - **公开分发零特权密钥安全架构**：客户端彻底剥离管理员写库令牌，全量开奖由云端 Cloud Scheduler 每日自动同步并经 GCS 快照持久化，零配置开箱即用；
            - **精准子平八字与易理融合**：支持 1900–2100 农历/公历双向互转、真太阳时与均时差校正、8 步大运虚岁时间轴、姓名五格数理卡片与《周易》64 卦全库典籍印证；
            - **全闭环选号与复盘体验**：4 大官方彩种 × 4 大策略 × 1/5/10/20 注、定胆/杀号与自定义三元权重、走势遗漏热力矩阵点击查详情与一键定胆/杀号、收藏夹防重懒加载及最近 10 期自动对奖复盘；
            - **双主题护眼与流畅交互**：玄墨暗金 / 宣纸浅色（6.3:1 高对比度赤金）一键切换、AI 流式解盘不抢滚动条、透明降级提示与 DeepSeek R1 思考链折叠、内置隐私政策与理性购彩合规告知。
          files: android/app/build/outputs/apk/release/ZengLian-Lottery-v${{ steps.version.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
